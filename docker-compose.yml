name: smartchef

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartchef
      POSTGRES_PASSWORD: smartchef
      POSTGRES_DB: smartchef
      TZ: Asia/Almaty
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # host-порт 5433 — 5432 занят локальным PostgreSQL разработчика
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartchef"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://smartchef:smartchef@postgres:5432/smartchef
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
    command: >
      sh -c "alembic upgrade head && python -m app"

  # ── Опциональная админка БД ────────────────────────────────────────────────
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["dev"]

volumes:
  postgres-data:
  redis-data:
